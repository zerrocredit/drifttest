<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Drift Hunters</title>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader2019.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "Build/drift-hunters.json", // Make sure this path is correct
        {
            onProgress: UnityProgress,
            Module: {
                onRuntimeInitialized: function() {
                    UnityProgress(gameInstance, "complete");
                }
            }
        });
    </script>

    <style>
      /* Ensure the game takes up the entire screen */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;  /* Remove scrollbars */
      }

      /* Make the game container full-screen */
      #gameContainer {
        width: 100%;
        height: 100%;
        position: absolute;  /* Absolute position ensures it fills the screen */
        top: 0;
        left: 0;
      }

      /* Make sure the div holding the game container takes up the whole screen */
      .webgl-content {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer"></div>
    </div>
  </body>
</html>
