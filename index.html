<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Drift Hunters</title>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader2019.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "Build/drift-hunters.json",
        {
            onProgress: UnityProgress,
            Module: {
                onRuntimeInitialized: function() {
                    UnityProgress(gameInstance, "complete");
                }
            }
        });

      function fixGameView() {
        const gameView = document.getElementById("gameView");
        if (gameView.clientHeight > gameView.clientWidth) {
            gameView.style.height = Math.floor(gameView.clientWidth) + "px";
        }
      }
    </script>

    <style>
      /* Remove all margins and padding from body and html */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;  /* Prevent scrollbars */
        background: none;  /* No background */
      }

      /* Make the game view take the entire screen */
      #gameView {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      #gameContainer {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body onload="fixGameView()">
    <div id="gameView" class="webgl-content">
        <div id="gameContainer"></div>
    </div>
  </body>
</html>
